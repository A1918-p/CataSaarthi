# CataSaarthi AI - central configuration
# Edit this file to change paths, seed, or model choices. Nothing should be hard-coded elsewhere.

project:
  name: "CataSaarthi AI"
  task: "Binary screening - Normal vs Suspected Cataract (fundus images)"
  seed: 42

data:
  # The ONLY machine-specific line. On a teammate PC, Kaggle, or Colab, change just this.
data:
  root: "D:/catasaarthi_data"
  raw_subdir: "raw"
  processed_subdir: "processed"
  models_subdir: "models"
  outputs_subdir: "outputs"
  originals_subdir: "ODIR-5K"   # full-res originals live under raw/ODIR-5K (searched recursively)

split:
  val_size: 0.15
  test_size: 0.15
  patient_level: true   # both eyes of a patient stay in the same split - prevents data leakage

image:
  size: 224             # model input resolution (square)

model:
  backbone: "resnet50"  # baseline; we will compare efficientnet_b0 and densenet121
  pretrained: true

train:
  epochs: 15          # the real GPU run; smoke test overrides with --epochs 1
  batch_size: 16
  lr: 0.0003
  num_workers: 0      # keep 0 on Windows; can raise on Linux/Colab
  monitor: "auprc"    # keep the checkpoint with the best val AUPRC (suits imbalance)
